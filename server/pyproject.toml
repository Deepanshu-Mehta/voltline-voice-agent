[project]
name = "voltline-server"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "fastembed>=0.9.1",
    "google-genai>=3.2.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "openai>=3.49.0",
    "pydantic-settings>=2.16.2",
    "python-frontmatter>=1.3.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "faster-whisper>=1.2.1",
    "librosa>=1.0.1",
    "playwright>=1.65.1",
    "praat-parselmouth>=0.4.7",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "requests>=2.34.2",
    "sounddevice>=0.5.6",
    "torch>=2.15.0",
    "torchaudio>=2.11.1",
    "torchmetrics>=1.9.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
